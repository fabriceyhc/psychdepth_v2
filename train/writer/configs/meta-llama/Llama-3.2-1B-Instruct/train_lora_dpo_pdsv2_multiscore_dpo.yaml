### model
model_name_or_path: meta-llama/Llama-3.2-1B-Instruct
trust_remote_code: true
cache_dir: /data2/.shared_models

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
deepspeed: ./LLaMA-Factory/examples/deepspeed/ds_z3_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset_dir: ./LLaMA-Factory/data
dataset: pdsv2_multiscore_dpo
template: llama3
cutoff_len: 4096
max_samples: 10
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: 
  /data2/.shared_models/lora/meta-llama/Llama-3.2-1B-Instruct/pdsv2_multiscore_dpo/dpo
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint:

